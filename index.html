<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contagem Regressiva ENEM</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Contagem Regressiva para o ENEM</h1>

    <p>Prepare-se! O grande dia está chegando!</p>

    <h2>Quanto falta?</h2>

    <div class="countdown">

        <div class="tempo">
            <p>Dias</p>
            <p id="dias-value">0</p>
        </div>

        <div class="tempo">
            <p>Horas</p>
            <p id="horas-value">0</p>
        </div>

        <div class="tempo">
            <p>Minutos</p>
            <p id="minutos-value">0</p>
        </div>

        <div class="tempo">
            <p>Segundos</p>
            <p id="segundos-value">0</p>
        </div>

    </div>

</body>

</html>
